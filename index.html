<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GATE // PLAYER ACCESS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#eaf7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:pan-x}
body{min-height:100svh}
#scene{position:relative;width:100%;height:100%;height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#12314a 0,#07111e 34%,#03050a 76%)}
#room{position:absolute;inset:0;display:grid;place-items:center;background:
 radial-gradient(ellipse at 50% 80%,rgba(0,195,255,.22),transparent 45%),
 linear-gradient(180deg,#050912 0%,#0b1b2a 60%,#03060b 100%);opacity:0;transform:scale(1.06);transition:opacity 1s ease,transform 1.2s ease}
#room.show{opacity:1;transform:scale(1)}
.grid{position:absolute;bottom:-8%;left:-20%;width:140%;height:48%;transform:perspective(420px) rotateX(62deg);background-image:linear-gradient(rgba(0,190,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(0,190,255,.18) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(transparent,#000)}
#avatarWrap{position:relative;width:min(56vw,360px);height:min(66vh,520px);display:grid;place-items:center;filter:drop-shadow(0 0 30px rgba(0,190,255,.35));z-index:2}
#avatar{max-width:100%;max-height:100%;object-fit:contain;display:none}
#placeholder{width:190px;height:260px;border:1px solid #3bd8ff66;border-radius:24px;background:linear-gradient(145deg,#153b56,#07101d);display:grid;place-items:center;text-align:center;padding:20px;color:#a8eaff;box-shadow:0 0 45px #00bfff22}
#placeholder b{font-size:64px;display:block}
#name{position:absolute;top:10%;left:0;right:0;text-align:center;letter-spacing:.28em;font-size:clamp(18px,3vw,30px);font-weight:800;text-shadow:0 0 18px #00bfff}
#sub{position:absolute;top:16%;left:0;right:0;text-align:center;color:#8cb9cc;font-size:11px;letter-spacing:.35em}
#doors{position:absolute;inset:0;perspective:1400px;z-index:5;display:flex}
.door{position:relative;width:50%;height:100%;background:linear-gradient(100deg,#05080e,#172330 48%,#070b12);border:1px solid #4ccfff55;box-shadow:inset 0 0 50px #000,0 0 28px #00bfff22;transition:transform 1.45s cubic-bezier(.18,.75,.12,1),filter 1.45s}
.door:before{content:"";position:absolute;inset:4%;border:1px solid #60dfff44;background:repeating-linear-gradient(0deg,transparent 0 78px,#55cfff12 79px 80px),linear-gradient(135deg,#142433aa,#03070dcc)}
.door:after{content:"";position:absolute;top:0;bottom:0;width:3px;background:#62e4ff;box-shadow:0 0 12px #00bfff,0 0 35px #00bfff}
.left{transform-origin:left center}.left:after{right:8px}.right{transform-origin:right center}.right:after{left:8px}
#doors.open .left{transform:rotateY(-105deg);filter:brightness(.55)}
#doors.open .right{transform:rotateY(105deg);filter:brightness(.55)}
.seam{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#a5f4ff;z-index:6;box-shadow:0 0 20px #00cfff}
#panelText{position:absolute;z-index:8;bottom:10%;left:0;right:0;text-align:center;pointer-events:none}
#hint{font-size:12px;letter-spacing:.22em;color:#c6eaff;text-shadow:0 0 12px #00bfff}
#status{font-size:10px;color:#6e9cb1;letter-spacing:.25em;margin-top:10px}
#upload{position:absolute;z-index:10;bottom:24px;left:50%;transform:translateX(-50%);width:min(85%,340px);padding:12px 16px;border:1px solid #4ccfff88;border-radius:14px;background:#071522e8;color:#dff8ff;font-size:13px}
#upload input{display:none}
#upload label{display:block;text-align:center}
#reset{position:absolute;z-index:11;top:calc(env(safe-area-inset-top) + 14px);right:14px;border:1px solid #4ccfff66;background:#071522cc;color:#ccefff;border-radius:20px;padding:8px 12px;font-size:11px}
#flash{position:absolute;inset:0;z-index:9;background:#dffaff;opacity:0;pointer-events:none}
#flash.go{animation:flash .7s ease}
@keyframes flash{0%{opacity:0}25%{opacity:.22}100%{opacity:0}}
@media(orientation:portrait){#avatarWrap{width:68vw;height:58vh}#name{top:12%}#sub{top:17%}}
</style>
</head>
<body>
<div id="scene">
 <div id="room">
  <div class="grid"></div>
  <div id="name">PLAYER PROFILE</div><div id="sub">ACCESS GRANTED // LEVEL UP</div>
  <div id="avatarWrap">
   <div id="placeholder"><div><b>✦</b>YOUR CHARACTER<br><small>Upload your avatar below</small></div></div>
   <img id="avatar" alt="Your game character">
  </div>
 </div>
 <div id="doors"><div class="door left"></div><div class="door right"></div><div class="seam"></div></div>
 <div id="panelText"><div id="hint">↑ SWIPE UP TO UNLOCK</div><div id="status">GATE SYSTEM // STANDBY</div></div>
 <button id="reset">重新關門 ↺</button>
 <div id="flash"></div>
 <div id="upload"><label for="file">＋ 選擇你的遊戲角色圖片</label><input id="file" type="file" accept="image/*"></div>
</div>
<script>
const doors=document.querySelector('#doors'),room=document.querySelector('#room');
const hint=document.querySelector('#hint'),status=document.querySelector('#status');
const flash=document.querySelector('#flash'),file=document.querySelector('#file');
let startY=null,opened=false;
function openGate(){
 if(opened)return; opened=true;
 doors.classList.add('open');room.classList.add('show');
 hint.textContent='ACCESS GRANTED';status.textContent='WELCOME BACK, PLAYER';
 flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
}
function closeGate(){
 opened=false;doors.classList.remove('open');room.classList.remove('show');
 hint.textContent='↑ SWIPE UP TO UNLOCK';status.textContent='GATE SYSTEM // STANDBY';
}
document.addEventListener('touchstart',e=>{if(e.touches.length===1)startY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
 if(startY===null)return;const dy=startY-e.changedTouches[0].clientY;
 if(dy>55)openGate();startY=null;
},{passive:true});
document.addEventListener('pointerdown',e=>{startY=e.clientY});
document.addEventListener('pointerup',e=>{if(startY!==null&&startY-e.clientY>55)openGate();startY=null});
document.querySelector('#reset').addEventListener('click',closeGate);
file.addEventListener('change',()=>{
 const f=file.files&&file.files[0];if(!f)return;
 const url=URL.createObjectURL(f),img=document.querySelector('#avatar');
 img.src=url;img.style.display='block';document.querySelector('#placeholder').style.display='none';
});
</script>
</body>
</html>
